                - paragraph [ref=e267]:
                  - text: Connect your AI tools to Vercel using the
                  - link "Model Context Protocol (MCP)" [ref=e268] [cursor=pointer]:
                    - /url: https://modelcontextprotocol.io
                  - text: ", an open standard that lets AI assistants interact with your Vercel projects."
                - heading [level=2] [ref=e270]:
