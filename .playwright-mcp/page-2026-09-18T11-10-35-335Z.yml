                  - link "Setup" [ref=e346] [cursor=pointer]:
                    - /url: "#setup"
                - paragraph [ref=e347]: Connect your AI client to Vercel MCP and authorize access to manage your Vercel projects.
                - heading [level=3] [ref=e349]:
                  - link "Install with add-mcp" [ref=e350] [cursor=pointer]:
