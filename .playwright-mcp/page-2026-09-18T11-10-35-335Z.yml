                - heading [level=2] [ref=e289]:
                  - link "What is Vercel MCP?" [ref=e290] [cursor=pointer]:
                    - /url: "#what-is-vercel-mcp"
                - paragraph [ref=e291]: "Vercel MCP is Vercel's official MCP server. It's a remote MCP with OAuth that gives AI tools secure access to your Vercel projects available at:"
                - paragraph [ref=e292]:
                  - code [ref=e293]: https://mcp.vercel.com
                - paragraph [ref=e294]: "It integrates with popular AI assistants like Claude, enabling you to:"
                - list [ref=e295]:
                  - listitem [ref=e296]: Search and navigate Vercel documentation
                  - listitem [ref=e297]: Manage projects and deployments
                  - listitem [ref=e298]: Analyze deployment logs
                  - listitem [ref=e299]: Query visitors, page views, and custom events
                - paragraph [ref=e300]:
                  - text: Vercel MCP implements the latest
                  - link "MCP Authorization" [ref=e301] [cursor=pointer]:
                    - /url: https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization
                  - text: and
                  - link "Streamable HTTP" [ref=e302] [cursor=pointer]:
                    - /url: https://modelcontextprotocol.io/specification/2025-06-18/basic/transports#streamable-http
                  - text: specifications.
                - heading [level=2] [ref=e304]:
                  - link "Available tools" [ref=e305] [cursor=pointer]:
                    - /url: "#available-tools"
                - paragraph [ref=e306]:
                  - text: Vercel MCP provides a comprehensive set of tools for searching documentation, managing your Vercel projects, and querying Web Analytics. See the
                  - link "tools reference" [ref=e307] [cursor=pointer]:
                    - /url: /docs/agent-resources/vercel-mcp/tools
                  - text: "for detailed information about each available tool and the two main categories: public tools (available without authentication) and authenticated tools (requiring Vercel authentication)."
                - paragraph [ref=e308]:
                  - text: Follow
                  - link "Manage Vercel projects with a software factory" [ref=e309] [cursor=pointer]:
                    - /url: /kb/guide/software-factory-vercel-mcp
                  - text: to give an eve agent read-only access to deployment data through Vercel Connect and diagnose failed deployments.
                - heading [level=2] [ref=e311]:
                  - link "Connecting to Vercel MCP" [ref=e312] [cursor=pointer]:
                    - /url: "#connecting-to-vercel-mcp"
                - paragraph [ref=e313]: To ensure secure access, Vercel MCP only supports AI clients that have been reviewed and approved by Vercel.
                - heading [level=2] [ref=e315]:
                  - link "Supported clients" [ref=e316] [cursor=pointer]:
                    - /url: "#supported-clients"
